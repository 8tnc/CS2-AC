name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Windows x64
        shell: pwsh
        run: ./build-windows.ps1 -BuildDirectory build-windows-ci
      - name: Package Windows x64
        shell: pwsh
        run: Compress-Archive -Path build-windows-ci/package/game -DestinationPath CS2AC-1.0.0-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: CS2AC-1.0.0-windows-x64
          path: CS2AC-1.0.0-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Linux SteamRT3 x64
        run: ./build-linux.sh build-linux-ci
      - name: Package Linux x64
        run: cd build-linux-ci/package && zip -qr ../../CS2AC-1.0.0-linux-x64.zip game
      - uses: actions/upload-artifact@v6
        with:
          name: CS2AC-1.0.0-linux-x64
          path: CS2AC-1.0.0-linux-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: CS2AC-1.0.0-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
